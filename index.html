<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Button Finder</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }
        table,th,td{
            border: 1px solid red;
        }

        .project{
            height: 100dvh;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
        }

        .color{
            color: aliceblue;
            display: flex;
            flex-direction: column;
            font-size: 20px;
        }
        table tr td{
            padding: 15px 30px;
        }

        .key{
            font-size: 22px;
            color: white;
            font-family: sans-serif;
            font-weight: 600;
        }
    </style>

</head>
<body>
    <div class="project">
        <div id="insert">
            <div class="key">Press the key and watch magic</div>
        </div>
    </div>
</body>
<script src="app.js"></script>
</html>
